[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcm-single-eval"
version = "0.1.0"
description = "Collect and trigger single RoadModel evaluations with traceable raw results"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gt = ["numpy>=1.24", "threadpoolctl>=3.1,<4"]
vision = ["Pillow>=10"]

[project.scripts]
pcm-eval = "pcm_eval.cli:main"

[tool.setuptools.packages.find]
include = ["pcm_eval*"]
